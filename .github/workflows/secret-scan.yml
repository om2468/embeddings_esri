name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly full-history scan, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan every commit, not only the latest tree
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan git history
        # --redact keeps any found value out of the public job log.
        run: ./gitleaks git --no-banner --redact --verbose --exit-code 1 .

  alert:
    name: Alert on failure
    needs: [secrets]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update an alert issue
        uses: actions/github-script@v7
        env:
          ASSIGNEE: ${{ vars.ALERT_ASSIGNEE || github.repository_owner }}
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const title = `Secret scan alert: ${context.workflow} failed on ${branch}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `@${process.env.ASSIGNEE} [${context.workflow} run](${run}) failed ` +
              `(event \`${context.eventName}\`, commit ${context.sha.slice(0, 7)}). ` +
              'A leaked credential in a public repository must be rotated; removing it from the files is not enough.';
            const open = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100 });
            const existing = open.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, assignees: [process.env.ASSIGNEE] });
            }
